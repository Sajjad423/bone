<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأفعى العظمية المجنحة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            touch-action: none; /* منع التمرير على الهواتف */
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .instruction {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #666666;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instruction">إلمس الشاشة وحرّك إصبعك ليتبعك المخلوق... وعند رفع إصبعك يتوقف!</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // حالة التتبع واللمس
        let isTouching = false;
        const target = { x: width / 2, y: height / 2 };

        function startTouch(e) {
            isTouching = true;
            updateTarget(e);
        }

        function endTouch() {
            isTouching = false;
        }

        function updateTarget(e) {
            if (!isTouching) return;
            if (e.touches && e.touches.length > 0) {
                target.x = e.touches[0].clientX;
                target.y = e.touches[0].clientY;
            } else {
                target.x = e.clientX;
                target.y = e.clientY;
            }
        }

        // إحداثيات الماوس واللمس
        window.addEventListener('mousedown', startTouch);
        window.addEventListener('mouseup', endTouch);
        window.addEventListener('mousemove', updateTarget);

        window.addEventListener('touchstart', startTouch, { passive: true });
        window.addEventListener('touchend', endTouch, { passive: true });
        window.addEventListener('touchmove', updateTarget, { passive: true });

        // إنشاء هكيل الأفعى المجنحة
        class BoneSerpent {
            constructor() {
                this.numSegments = 35; // عدد فقرات الأفعى
                this.segmentLength = 14; // المسافة بين كل فقرة
                this.segments = [];

                // تهيئة الفقرات في منتصف الشاشة
                for (let i = 0; i < this.numSegments; i++) {
                    this.segments.push({
                        x: width / 2 - i * this.segmentLength,
                        y: height / 2,
                        angle: 0
                    });
                }

                this.wingFlap = 0; // زاوية رفرفة الأجنحة
            }

            update() {
                this.wingFlap += 0.15;

                // إذا كان الإصبع مرفوعاً، تتوقف الأفعى في مكانها
                if (!isTouching) return;

                // تحريك الرأس نحو الهدف
                const head = this.segments[0];
                const dx = target.x - head.x;
                const dy = target.y - head.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    const angle = Math.atan2(dy, dx);
                    head.angle = angle;
                    head.x += Math.cos(angle) * Math.min(dist * 0.1, 9);
                    head.y += Math.sin(angle) * Math.min(dist * 0.1, 9);
                }
                // تحريك باقي فقرات الجسم بشكل ثعباني متسلسل
                for (let i = 1; i < this.numSegments; i++) {
                    const prev = this.segments[i - 1];
                    const curr = this.segments[i];

                    const dx = prev.x - curr.x;
                    const dy = prev.y - curr.y;
                    curr.angle = Math.atan2(dy, dx);

                    curr.x = prev.x - Math.cos(curr.angle) * this.segmentLength;
                    curr.y = prev.y - Math.sin(curr.angle) * this.segmentLength;
                }
            }

            draw() {
                // 1. رسم الأجنحة العظمية عند الفقرة الثالثة
                this.drawWings(this.segments[3]);

                // 2. رسم الفقرات والأضلاع العظمية من الذيل إلى الرأس
                for (let i = this.numSegments - 1; i >= 1; i--) {
                    this.drawRibSegment(this.segments[i], i);
                }

                // 3. رسم الجمجمة المرعبة والأنياب
                this.drawSkull(this.segments[0]);
            }

            // رسم الأجنحة الهيكلية
            drawWings(segment) {
                ctx.save();
                ctx.translate(segment.x, segment.y);
                ctx.rotate(segment.angle);

                const flap = Math.sin(this.wingFlap) * 0.3; // تأثير حركة الأجنحة

                // جناحين (يمين ويسار)
                for (let side of [-1, 1]) {
                    ctx.save();
                    ctx.scale(1, side);
                    ctx.rotate(flap);

                    ctx.strokeStyle = '#e0e0e0';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(200, 200, 255, 0.2)';

                    // العظام الرئيسية للمفصل العظمي للجناح
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-10, 40);
                    ctx.lineTo(30, 90);
                    ctx.lineTo(10, 130);
                    ctx.stroke();

                    // أصابع الأجنحة العظمية (مثل أجنحة الخفاش العظمي)
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(30, 90);
                    ctx.lineTo(-20, 140);
                    ctx.moveTo(30, 90);
                    ctx.lineTo(5, 160);
                    ctx.moveTo(30, 90);
                    ctx.lineTo(35, 150);
                    ctx.stroke();

                    ctx.restore();
                }

                ctx.restore();
            }

            // رسم الفقرات والأضلاع
            drawRibSegment(seg, index) {
                ctx.save();
                ctx.translate(seg.x, seg.y);
                ctx.rotate(seg.angle);

                ctx.strokeStyle = '#e6e6e6';
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.2)';

                // حجم الأضلاع يقل باتجاه الذيل
                const ribWidth = Math.max(2, (this.numSegments - index) * 0.8);
                const ribLength = Math.max(4, (this.numSegments - index) * 1.1);

                // رسم الضعلين (الأيمن والأيسر)
                ctx.beginPath();
                ctx.lineWidth = 2;
                ctx.moveTo(0, -ribLength);
                ctx.quadraticCurveTo(ribWidth, 0, 0, ribLength);
                ctx.stroke();

                // عقدة الفقرة العظمية في المركز
                ctx.beginPath();
                ctx.arc(0, 0, Math.max(1.5, (this.numSegments - index) * 0.25), 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // رسم الجمجمة المرعبة للأفعى
            drawSkull(head) {
                ctx.save();
                ctx.translate(head.x, head.y);
                ctx.rotate(head.angle);

                ctx.fillStyle = '#f0f0f0';
                ctx.strokeStyle = '#cccccc';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff0000'; // توهج أحمر خفيف للمظهر المرعب
                // شكل هيكل الجمجمة الرئيسي
                ctx.beginPath();
                ctx.moveTo(-10, -8);
                ctx.lineTo(15, -10);
                ctx.lineTo(30, 0); // مقدمة الفك المدبب
                ctx.lineTo(15, 10);
                ctx.lineTo(-10, 8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // تجاويف العيون المظلمة مع التوهج الأحمر
                ctx.fillStyle = '#ff0033';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0033';
                ctx.beginPath();
                ctx.arc(8, -5, 3, 0, Math.PI * 2);
                ctx.arc(8, 5, 3, 0, Math.PI * 2);
                ctx.fill();

                // بؤبؤ العين الأسود الحاد
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(8, -5, 1, 0, Math.PI * 2);
                ctx.arc(8, 5, 1, 0, Math.PI * 2);
                ctx.fill();

                // الأنياب العظمية الحادة المرعبة
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#aaaaaa';
                ctx.lineWidth = 1;

                // ناب علوي وسفلي
                ctx.beginPath();
                ctx.moveTo(22, -6);
                ctx.lineTo(32, -2);
                ctx.lineTo(20, -1);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(22, 6);
                ctx.lineTo(32, 2);
                ctx.lineTo(20, 1);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        const serpent = new BoneSerpent();

        // حلقة الرسم والتحديث
        function animate() {
            // مسح الشاشة باللون الأسود المطلق
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            serpent.update();
            serpent.draw();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
